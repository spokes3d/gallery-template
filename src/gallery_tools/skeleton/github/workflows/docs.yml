name: Docs

# Generated by `gallery export`. The site, built from the cached results (no simulation runs),
# with the shared workflow of max-models/starlight-theme; deployed to GitHub Pages from devel.

on:
  push:
    branches: ["main", "devel", "sync"]
  pull_request:
    branches: ["main", "devel"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    uses: max-models/starlight-theme/.github/workflows/docs.yml@v0
    with:
      node-version: "24"
      notebooks: false
      pre-build: uv run gallery build --cached-only
      smoke-paths: |
        studies/index.html
