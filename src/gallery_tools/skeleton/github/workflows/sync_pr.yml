name: Sync pull request

# Generated by `gallery export`. The private gallery pushes the export of its public studies to
# the branch `sync` (with a deploy key of this repository); this opens the pull request into
# devel, once. Needs "Allow GitHub Actions to create and approve pull requests" (Settings,
# Actions, General).

on:
  push:
    branches: ["sync"]

permissions:
  contents: read
  pull-requests: write

jobs:
  pull-request:
    runs-on: ubuntu-latest
    steps:
      - name: Open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          open=$(gh pr list --repo "$REPO" --head sync --base devel --state open --json number --jq 'length')
          if [ "$open" = 0 ]; then
            gh pr create --repo "$REPO" --head sync --base devel \
              --title "Sync the public studies" \
              --body "The public studies of the private gallery, exported by its sync workflow (see .gallery-export.json for the source commit). Review the changes, then merge to publish them." \
              || {
                # opened meanwhile (e.g. by hand) is fine; anything else (a merged PR from an
                # earlier sync does not count) is an error, e.g. "Allow GitHub Actions to create
                # and approve pull requests" is off
                open=$(gh pr list --repo "$REPO" --head sync --base devel --state open --json number --jq 'length')
                [ "$open" != 0 ] || { echo "::error::could not open the pull request (see above)"; exit 1; }
              }
          else
            echo "the pull request is open; the push updated it"
          fi
