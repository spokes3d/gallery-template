name: Sync merge

# Generated by `gallery export`. Merges the sync pull request into devel once every check of its
# commit has passed, and then deploys the site. The changes were reviewed in the private gallery;
# this repository only receives its export.
#
# It runs after each run of Tests and Docs on the branch `sync` and acts when the last of them
# finishes. A merge made with the workflow token starts no push workflow, so it starts the Docs
# workflow on devel itself. Needs "Allow GitHub Actions to create and approve pull requests"
# (Settings, Actions, General), as sync_pr.yml does.

on:
  workflow_run:
    workflows: ["Tests", "Docs"]
    types: [completed]
    branches: ["sync"]

permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: write

concurrency:
  group: sync-merge
  cancel-in-progress: false

jobs:
  merge:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Merge the sync pull request and deploy
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr=$(gh pr list --repo "$REPO" --head sync --base devel --state open \
            --json number,headRefOid --jq ".[] | select(.headRefOid == \"$SHA\") | .number")
          if [ -z "$pr" ]; then
            echo "no open sync pull request at $SHA (merged already, or the branch moved on)"
            exit 0
          fi
          # every check of the commit, from all its workflows, has finished and none failed
          waiting=$(gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" --jq \
            '[.check_runs[] | select(.status != "completed" or (.conclusion | IN("success", "skipped", "neutral") | not))] | length')
          if [ "$waiting" != 0 ]; then
            echo "$waiting checks of $SHA are running or did not pass: not merging"
            exit 0
          fi
          gh pr merge "$pr" --repo "$REPO" --merge --match-head-commit "$SHA"
          gh workflow run docs.yml --repo "$REPO" --ref devel
