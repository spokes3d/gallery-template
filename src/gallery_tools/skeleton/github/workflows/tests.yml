name: Tests

# Generated by `gallery export`. Every study is well formed, has its cached result, and runs in
# its smoke preset. The sync branch is tested on push: its pull request is opened by a workflow,
# which starts no workflow itself, and shows the checks of this run.

on:
  push:
    branches: ["main", "devel", "sync"]
  pull_request:
    branches: ["main", "devel"]
  workflow_dispatch:

jobs:
  studies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --extra test

      - name: Check the studies
        run: uv run gallery check

      - name: Run the studies in their smoke preset
        run: uv run pytest
